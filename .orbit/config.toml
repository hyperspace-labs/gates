[[target]]
name = "yilinx"
description = "Generate bitstreams for Yilinx FPGAs"
command = "python"
fileset.pinout = "*.ydc"
args = ["yilinx.py"]


[[protocol]]
name = "gitit"
description = "Download ip using git"
patterns = ["*.git"]
command = "git"
args = ["clone", "{{ orbit.ip.source }}"]


[build]
default-target = "yilinx"

[install]
default-protocol = "gitit"
